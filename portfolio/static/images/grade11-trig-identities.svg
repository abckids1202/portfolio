<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520"><rect width="900" height="520" fill="#182a21"/><text x="55" y="90" fill="#c9ed8c" font-family="sans-serif" font-size="46" font-weight="700">IDENTITIES</text><text x="55" y="210" fill="#fff4d8" font-family="serif" font-size="48">sin²θ + cos²θ = 1</text><text x="55" y="300" fill="#9fd6ff" font-family="serif" font-size="38">tan θ = sin θ / cos θ</text><text x="55" y="390" fill="#f6c1d4" font-family="serif" font-size="38">1 + tan²θ = sec²θ</text><circle cx="755" cy="265" r="120" fill="none" stroke="#c9ed8c" stroke-width="5"/><path d="M755 265 755 145M755 265 875 265" stroke="#8cc9ff" stroke-width="5"/><path d="M755 145A120 120 0 0 1 875 265" fill="none" stroke="#f6c1d4" stroke-width="10"/></svg>
